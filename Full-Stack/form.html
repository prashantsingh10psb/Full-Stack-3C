<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            text-align: center;
            font-size: 40px;
            font-family:'Courier New', Courier, monospace;
        }
        input{
            font-size: 35px;
            border-width:  0 0 2px;
            border-color: black;
            border-style: solid;
            margin: 3px;
        } input::placeholder{
            color: rgb(230, 191, 221);
            font-size: 20px;
        }
         input[required]::placeholder{
            color: rgb(230, 109, 202);
            font-size: 20px;
        }
        input:required{
            border-color: red;
        }
        input:optional{
            border-color: green;
        }
        input:valid{
            border-color: blue;
        }
        body{
            background-color: lightgray;
        }
        input[required]:hover{
            background-color: wheat;
        }
        input:in-range{
            color: green;
        }
        input:out-of-range{
            color: red;
        }
        div:has(h1){
            background-color: rgb(35, 177, 225);
            text-align: center;
        }
        div:not(:has(h1)){
            background-color: lightgreen;
            text-align: center;
        }
    </style>
</head>
<body> <h2>Application Form</h2>
    <form>

        <input type="text" placeholder="Name" required><br><br>
        <input type="text" placeholder="Middle Name" ><br><br>
        <input type="text" placeholder="Last Name" required><br><br>
        <input type="text" placeholder="Father Name"><br><br>
        <input type="email" placeholder="Email" required><br><br>

        <input type="number" min="10" max="100" placeholder="Age" required />
        <input type="submit" value="Submit">
    </form> <br>

    <div>
        <h2> Heading1</h2>
    </div>
    <div><h1>
        Heading2
    </h1></div>
</body>
</html>
