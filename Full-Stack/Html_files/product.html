<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #product-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #product-card {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container" id="product-container">
        <h2>Product Page</h2>
        <div id="product-card">
            <h3>Product Name</h3>
            <p>Description of the product.</p>
            <p>Price: $XX.XX</p>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
