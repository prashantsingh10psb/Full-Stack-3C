<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-areas: "box1 box1 box2"
                                 "box1 box1 box3"
                                  "box4 box4 box4"
                                 "box5 box6 box7";
            outline: 1px solid black;
        }
        .grid-container > div {
            outline: 1px dashed black;
            font-size: 30px;

        }
         .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            outline: 1px solid black;
        }
        .container > div {
            align-items: center;
            justify-content: center;
            display: flex;

            font-size: 30px;
            outline: 1px dashed black;

        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div style="grid-area: box1;">1</div>
        <div style="grid-area: box2;">2</div>
        <div style="grid-area: box3;">3</div>
        <div style="grid-area: box4;">4</div>
        <div style="grid-area: box5;">5</div>
        <div style="grid-area: box6;">6</div>
        <div style="grid-area: box7;">7</div>
    </div><br>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
       
    </div>
</body>
</html>
