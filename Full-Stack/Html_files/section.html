<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section h2{
            color: red;
        }
        section>h2{
            color: blue;
        }
        h2~p{
            color: orange;
            font-size: 35px;
        }
        h2+p{
            color: green;
            text-shadow: 0 0 3px black;
            font-size: 35px;
        }
        
    </style>
</head>
<body>
    
    <section>
        <h2>Heading</h2>
        <p>Prashant</p>
        <p>Web Developer</p>
        <div>
            <h2>Heading2</h2>
        </div>
    </section>
</body>
</html>
