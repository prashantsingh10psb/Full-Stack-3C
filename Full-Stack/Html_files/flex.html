<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
             justify-content: space-evenly;
             flex-direction: column;
             outline: 3px solid black;
             align-items: center;
             height: 90vh;
        }
        .container > div {
            width: 200px;
            height: 100px;
            align-content: center;
            text-align: center;
        }
        #box1 {
            background-color: lightcoral;
            flex-basis: 150px;
            /*  flex-grow: 2; */
            flex-shrink: 2;
            flex-wrap: 2;
        }
        #box2 {
           flex-basis: 160px;
            /*  flex-grow: 1; */
            background-color: rgb(79, 201, 22);
            flex-shrink: 1;
            flex-wrap: 1;
        }
        #box3 {
             flex-basis: 150px; 
            /* flex-grow: 1.5;  */
            background-color: orange;
            flex-shrink: 1;
            flex-wrap: 2;
        }
        body{
            background-color: wheat;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">Box 1</div>
        
        <div id="box2">Box 2</div>
        <div id="box3">Box 3</div>
        
    </div>
</body>
</html>
