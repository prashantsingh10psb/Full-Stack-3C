<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{font-size: 40px;}
        p:hover{
            color: red;
        }
        button{
            font-size: 30px;
            background-color: wheat;
        }
        button:hover{
            font-size: 40px;
            background-color: yellow;
            box-shadow: 3px 3px 5px black;
        }
        button:active{
            background-color: orange;
            box-shadow: 0px 0px 0px;
        }
        input[type="checkbox"]{
            height: 40px;
            width: 40px;
        }
        input[type="checkbox"]:hover{
            box-shadow: 6px 3px 5px black;
        }
        input:checked{
            accent-color: red;
        }
    </style>
</head>
<body>
    <button>Click</button>
    <p>Hover over this text to change its color.</p>
    <input type="checkbox"/>
</body>
</html>
