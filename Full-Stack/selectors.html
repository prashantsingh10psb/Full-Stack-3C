<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 5px;
            background-color: bisque;
        }
        #ii{
            color: red;
        }
        #class{
            color: blue;
        }
        input[type="email"]{
            background-color: yellow;
            border: 0 0 3px 0;
            border-color: red;
        }
        li[data="null"]{
            color: green;
        }
    </style>
</head>
<body>
    <h2> Selectors</h2>
    <ul>

        <li>Universal</li>
        <li id="ii">Id</li>
        <li id="class">Class</li>
        <li>Element</li>
        <li data="null">Attribute</li>
        <li>Combinators</li>
        <li>Pseudo Class</li>
        <li>Pseudo Element</li>
    </ul>
    <input type="email" placeholder="Enter your email"><br>
    <input type="password" placeholder="Enter your pass"><br>
</body>
</html>
